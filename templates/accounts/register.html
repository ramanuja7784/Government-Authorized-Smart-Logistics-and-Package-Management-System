{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - GasLMP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(rgba(30, 60, 114, 0.7), rgba(42, 82, 152, 0.8)),
            url('{% static "images/office_bg.png" %}') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 0;
        }

        .login-container {
            width: 100%;
            max-width: 500px;
            padding: 15px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            color: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .glass-card h2 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 28px;
        }

        /* Target Django form.as_p elements */
        .glass-card p {
            margin-bottom: 1.5rem;
        }

        .glass-card label {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
            margin-bottom: 8px;
            display: block;
        }

        .glass-card input,
        .glass-card select,
        .glass-card textarea {
            display: block;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 10px;
            padding: 10px 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        .glass-card select option {
            background: #2a5298;
            color: white;
        }

        .glass-card input:focus,
        .glass-card select:focus,
        .glass-card textarea:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            color: white;
        }

        .glass-card input::placeholder,
        .glass-card textarea::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Form help text and errors generated by Django */
        .helptext {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
            display: block;
        }

        .errorlist {
            color: #ff6b6b;
            list-style-type: none;
            padding-left: 0;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .btn-login {
            background: linear-gradient(to right, #f6d365 0%, #fda085 100%);
            border: none;
            color: #333;
            font-weight: 700;
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(253, 160, 133, 0.4);
            color: #111;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            display: block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .register-link:hover {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="glass-card">
            <h2>Create Account</h2>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-danger shadow-sm rounded-3"
                style="background: rgba(220, 53, 69, 0.8); border: none; color: white;">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-login">Register</button>
                <a href="{% url 'accounts:login' %}" class="register-link">Already have an account? Login here</a>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const roleSelect = document.getElementById("id_role");

            // Map of fields to their input IDs
            const fields = {
                courier: {
                    company_name: document.getElementById("id_company_name")
                },
                delivery_boy: {
                    full_address: document.getElementById("id_full_address"),
                    aadhar_number: document.getElementById("id_aadhar_number")
                },
                govt_auth: {
                    id_number: document.getElementById("id_id_number"),
                    id_card_pdf: document.getElementById("id_id_card_pdf")
                }
            };

            function updateFields() {
                const selectedRole = roleSelect.value;

                // Hide all role-specific fields initially
                for (const group in fields) {
                    for (const key in fields[group]) {
                        const input = fields[group][key];
                        if (input) {
                            const container = input.closest('p');
                            if (container) {
                                container.style.display = 'none';
                                input.required = false;
                            }
                        }
                    }
                }

                // Show fields based on selected role
                if (selectedRole === 'COURIER') {
                    for (const key in fields.courier) {
                        const input = fields.courier[key];
                        if (input) {
                            input.closest('p').style.display = 'block';
                            input.required = true;
                        }
                    }
                } else if (selectedRole === 'DELIVERY_BOY') {
                    for (const key in fields.delivery_boy) {
                        const input = fields.delivery_boy[key];
                        if (input) {
                            input.closest('p').style.display = 'block';
                            input.required = true;
                        }
                    }
                } else if (selectedRole === 'govt_auth') {
                    for (const key in fields.govt_auth) {
                        const input = fields.govt_auth[key];
                        if (input) {
                            input.closest('p').style.display = 'block';
                            input.required = true;
                        }
                    }
                }
            }

            if (roleSelect) {
                updateFields();
                roleSelect.addEventListener('change', updateFields);
            }
        });
    </script>
</body>

</html>
